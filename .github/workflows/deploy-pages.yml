name: Deploy to GitHub Pages

# Builds nothing — this is a static site. On every push to main we publish the
# ai-ml-knowledge-hub/ folder as the site root of GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (ai-ml-knowledge-hub as root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-ml-knowledge-hub

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
